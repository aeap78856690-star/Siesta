name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ver archivos
        run: |
          find app/src -type f
          echo "----- DECLARACIONES"
          grep -rnE "^(package|(data |open |abstract )?class|object|interface)" app/src/main/java --include=*.kt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: Resumen de errores
        if: failure()
        run: |
          grep -E "^e:" build.log | head -n 10
          grep -A8 "What went wrong" build.log | head -n 20

      - uses: actions/upload-artifact@v4
        with:
          name: Siesta-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error